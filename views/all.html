<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>Starter Template</title>

  <meta name="description" content="">
  <meta name="author" content="">

  <!-- Favicon -->
  <link rel="icon" href="">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.18.3/dist/bootstrap-table.min.css">

  <style>
    
    .content {
      margin-top: 50px;
    }

  </style>

</head>
<body>

  <nav class="navbar navbar-toggleable-md navbar-light bg-faded">
    <button class="navbar-toggler navbar-toggler-right" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <a class="navbar-brand" href="#">Navbar</a>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <!-- Navbar Left -->
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" href="#">Link</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Link</a>
        </li>
      </ul>
      <!-- Navbar Right -->
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">Link</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Link</a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="content">
    <div class="container">

        <a type="button" href="https://beugelbuddel.de/sound/addPlayer" class="btn btn-success">
            Spieler hinzufügen
        </a>

        <table id="table" data-toggle="table" data-pagination="true"
        data-search="true" data-show-search-clear-button="true" data-filter-control="true">
            <thead>
              <tr>
                <th data-sortable="true">Username</th>
                <th data-sortable="true">Anzeigename</th>
                <th data-field="mannschaft" data-filter-control="select">Mannschaft</th>
                <th>Aktion</th>
              </tr>
            </thead>
            <tbody>
                {{#spieler}}  
              <tr>       
            <td>{{username}}</td>  
            <td>{{anzeigename}}</td>  
            <td>{{mannschaft}}</td>
            <td> 
                {{#version}}
                <a type="button"  href="/sound/edit/{{username}}" class="btn btn-info">
    Lied bearbeiten
            </a> <a href="/sound/delete/{{username}}"type="button" class="btn btn-danger">
                Löschen
                        </a>
                        
                        <button type="button" onclick="play('{{username}}')" class="btn btn-success">
                            Abspielen
                        </button>
                        <audio id="{{username}}" src="https://beugelbuddel.de/sound/uploads/{{username}}.mp3"></audio>
                      {{/version}}

                      {{^version}}
                      <a type="button" href="/sound/edit/{{username}}"  class="btn btn-info">
                        Lied hinzufügen
                                </a> <a href="/sound/delete/{{username}}" type="button" class="btn btn-danger">
                                    Löschen
                                            </a>
                      {{/version}}
                    </td>
              </tr>

              {{/spieler}}
            </tbody>
          </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/bootstrap-table@1.18.3/dist/bootstrap-table.min.js"></script>
  <script src="https://unpkg.com/bootstrap-table@1.18.3/dist/extensions/filter-control/bootstrap-table-filter-control.min.js"></script>

  <script>
    $(function() {
      $('#table').bootstrapTable()
    })
  </script>

<script>
    function play(username) {
      var audio = document.getElementById(username);
      audio.play();
    }

    document.addEventListener('play', function(e){
    var audios = document.getElementsByTagName('audio');
    for(var i = 0, len = audios.length; i < len;i++){
        if(audios[i] != e.target){
            audios[i].pause();
        }
    }
}, true);
  </script>

</body>
</html>
