<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <title>Hello, world!</title>
  </head>
  <body>
    
    
    
    <div class="container">
       <div class="row">
         <div class="col-lg-4 col-md-6 ml-auto mr-auto">
           <div class="card card-login">
             <form class="form"  id="uploadForm"
             enctype="multipart/form-data"
             action="https://beugelbuddel.de/sound/upload"
             method="post">
               <div class="card-header card-header-success text-center">
                 <h4 class="card-title">TuRa Sound Upload</h4>
                 <div class="social-line">
                    <div id='bars'>
   <div class='bar'></div>
   <div class='bar'></div>
   <div class='bar'></div>
   <div class='bar'></div>
   <div class='bar'></div>
   <div class='bar'></div>
   <div class='bar'></div>
   <div class='bar'></div>
   <div class='bar'></div>
   <div class='bar'></div>
 </div>
 
                   <br>
                 </div>
               </div>
               <p class="description text-center">Die Datei sollte nicht länger als 8 Sekunden sein.
               </p>
               <div class="card-body">
 
           
 
                 <div class="input-group">
                   
                 <div class="custom-file">
     <input type="file" class="custom-file-input" name="mp3" accept=".mp3" id="customFile">
     <label class="custom-file-label" style="white-space: nowrap; overflow: hidden;" for="customFile">MP3 auswählen</label>
   </div>
                 </div>
 
 
                  <input type="hidden" id="username" name="username" value="{{spieler.username}}">
 
               </div>
               <div class="text-center">
                 <input style="padding: 15px;"  type="submit" value="Hochladen" class="btn btn-primary btn-link btn-wd btn-lg">
                 
                 <div id="status" class="alert alert-primary" role="alert">
                   </div>
               </div>
             </form>
           </div>
         </div>
       </div>
     </div>
 
   <!--   Core JS Files   -->
   <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js" integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo=" crossorigin="anonymous"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.form/4.2.2/jquery.form.js" integrity="sha256-LddDRH6iUPqbp3x9ClMVGkVEvZTrIemrY613shJ/Jgw=" crossorigin="anonymous"></script>
   <script src="assets/js/core/popper.min.js" type="text/javascript"></script>
   <script src="assets/js/core/bootstrap-material-design.min.js" type="text/javascript"></script>
   <script src="assets/js/plugins/moment.min.js"></script>
   <!--	Plugin for the Datepicker, full documentation here: https://github.com/Eonasdan/bootstrap-datetimepicker -->
   <script src="assets/js/plugins/bootstrap-datetimepicker.js" type="text/javascript"></script>
   <!--  Plugin for the Sliders, full documentation here: http://refreshless.com/nouislider/ -->
   <script src="assets/js/plugins/nouislider.min.js" type="text/javascript"></script>
   <!-- Control Center for Material Kit: parallax effects, scripts for the example pages etc -->
   <script src="assets/js/material-kit.js?v=2.0.5" type="text/javascript"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.9/dist/js/bootstrap-select.min.js"></script>
   <script>
 // Add the following code if you want the name of the file appear on select
 $(".custom-file-input").on("change", function() {
   var fileName = $(this).val().split("\\").pop();
   $(this).siblings(".custom-file-label").addClass("selected").html(fileName);
 });
 </script>
 
 <script>
 
 
   $(document).ready(function() {
     $('#status').hide();
      $('#uploadForm').submit(function() {
         $("#status").empty().text("Datei wird hochgeladen...");
         $(this).ajaxSubmit({
 
             error: function(xhr) {
               $('#status').show();
               console.log(xhr);
               $("#status").empty().text(xhr.responseText);
         status('Error: ' + xhr.responseText);
             },
 
             success: function(response) {
               $('#status').show();
               $('#uploadForm')[0].reset();
               $("#status").empty().text("Datei wurde erfolgreich hochgeladen...");

             }
     });
         //Very important line, it disable the page refresh.
     return false;
     });    
 });
 </script>
 </body>
 
 </html>
